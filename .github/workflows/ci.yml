name: synthetic-financial-milestone
on: [push, pull_request]
# Least privilege for the workflow token: the jobs only read the repository.
permissions:
  contents: read
jobs:
  local-sandbox:
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock -r requirements-onchain.txt
      - run: python -m scripts.security_scan
      - run: python -m scripts.check
      - run: python -m scripts.test
      - run: python -m scripts.demo --lost-response
      - run: python -m scripts.benchmark
      - run: python -m scripts.report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: actual-synthetic-evidence
          path: artifacts/
