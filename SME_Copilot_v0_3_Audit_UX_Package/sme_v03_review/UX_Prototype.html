<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="shell">
<aside class="sidebar"><div class="brand"><div class="brandmark" aria-hidden="true">S</div><div><b>SME Finance</b><small>OWNER WORKSPACE</small></div></div><nav class="nav" aria-label="Main navigation" id="navigation"></nav><div class="sidebarbottom"><div class="row"><div class="avatar">DO</div><div><b class="small">Demo owner</b><p class="small muted">Visual concept · no account</p></div></div><button class="linkbtn" style="margin-top:14px" onclick="openInfo()">About this prototype</button></div></aside>
<div class="content"><header class="topbar"><div><div class="company">Huaxin Supply <span class="badge">Fictional company</span></div><div class="small muted">Relative business dates · CNY · Sample starting balance</div></div><button class="btn" onclick="openCopilot()">✦ Ask Copilot</button></header>
<div class="notice"><b>DESIGN PROTOTYPE</b> · Synthetic example only. No live AI, backend connection or financial execution.</div>
<main id="main" tabindex="-1"></main></div></div>
<dialog id="dialog" aria-labelledby="dialogTitle"></dialog>
<div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
<script>
'use strict';
const navItems=[['home','Home','<path d="M3 10 12 3l9 7v10H3z"/><path d="M9 20v-7h6v7"/>'],['money','Money','<path d="M4 20V4M4 20h17M7 15l4-5 4 2 5-7"/>'],['plans','Plans','<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6M9 18h3"/>'],['documents','Documents','<path d="M5 3h9l5 5v13H5zM14 3v6h5M9 13h6M9 17h6"/>'],['activity','Activity','<path d="M3 12h4l3-7 4 14 3-7h4"/>']];
let view='home',delay=0,reviewed=false,mapping=false;
const fmt=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(n);
const full=n=>'CNY '+fmt(n);
const $=s=>document.querySelector(s);
function go(name){if(view===name){render();return;}location.hash=name;}
function announce(t){$('#announcement').textContent=t;}
function btn(t,js,primary=false){return `<button class="btn${primary?' primary':''}" onclick="${js}">${t}</button>`;}
function heading(title,desc,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`;}
function metric(label,n,sub,negative=false){return `<section class="metric"><div class="label">${label}</div><div class="value money${negative?' negative':''}"><span>CNY</span>${fmt(n)}</div><div class="sub">${sub}</div></section>`;}
function footer(){return `<footer class="footer"><span>UX direction for SME Finance Copilot · 13 October 2026</span><span>All values are from a simplified demonstration scenario.</span></footer>`;}
function movements(plan=false){let events=[{d:0,v:120000,label:'Opening balance'},{d:4,v:-80000,label:'Payroll'},{d:5,v:-20000,label:'Rent'},{d:7,v:-90000,label:'Supplier payment'},{d:10+delay,v:100000,label:'Customer receipt'}];if(plan)events.push({d:2,v:90000,label:'Net financing'},{d:30,v:-92000,label:'Loan repayment'});return events.sort((a,b)=>a.d-b.d||a.v-b.v);}
function totals(plan){let b=0,min=Infinity;for(const e of movements(plan)){b+=e.v;min=Math.min(min,b);}return {min,end:b};}
function chart(plan=true){const end=Math.max(30,10+delay),x=d=>76+d/end*734,y=v=>35+(230000-v)/320000*192;let ticks=[0,4,7,10,20,30];if(end>30)ticks.push(end);ticks=[...new Set(ticks)];function path(withPlan){let b=120000,s=`M ${x(0)} ${y(b)}`;for(const e of movements(withPlan).filter(e=>e.d>0)){s+=` H ${x(e.d)} V ${y(b+e.v)}`;b+=e.v;}s+=` H ${x(end)}`;return s;}return `<div class="chartbox"><svg class="chart" viewBox="0 0 850 272" role="img" aria-labelledby="chartTitle chartDesc"><title id="chartTitle">Illustrative cash forecast</title><desc id="chartDesc">Baseline minimum ${full(totals(false).min)}. ${plan?'Financed plan minimum '+full(totals(true).min)+'.':''} Customer payment delay ${delay} days. Sample data, not an API calculation.</desc>${[200000,100000,0,-50000].map(v=>`<line x1="76" y1="${y(v)}" x2="810" y2="${y(v)}" stroke="#E4EAF2"/><text x="62" y="${y(v)+4}" text-anchor="end" fill="#596579" font-size="11">${v===0?'0':fmt(v/1000)+'k'}</text>`).join('')}<line x1="76" y1="${y(20000)}" x2="810" y2="${y(20000)}" stroke="#A05815" stroke-dasharray="5 4"/><path d="${path(false)}" fill="none" stroke="#65758C" stroke-width="2.4" stroke-dasharray="7 5"/>${plan?`<path d="${path(true)}" fill="none" stroke="#2355C7" stroke-width="3"/>`:''}${ticks.map(d=>`<text x="${x(d)}" y="250" text-anchor="middle" fill="#596579" font-size="11">${d===0?'Today':'Day '+d}</text>`).join('')}<text x="76" y="17" fill="#596579" font-size="11">CNY · scenario illustration, not calibrated probabilities</text></svg></div><p class="mobilehint">Scroll the chart horizontally to inspect the timeline.</p><div class="legend"><span class="legenditem"><i class="legendline gray"></i>Keep current dates</span>${plan?'<span class="legenditem"><i class="legendline"></i>Bridge financing</span>':''}<span class="legenditem"><i class="legendline amber"></i>CNY 20,000 buffer</span></div>`;}
function obligationsTable(){return `<div class="tablewrap"><table><thead><tr><th>Payment</th><th>Due</th><th>Status</th><th class="num">Amount · CNY</th></tr></thead><tbody><tr><td><b>Payroll</b><div class="small muted">Protected obligation</div></td><td>Day 4</td><td><span class="badge">Upcoming</span></td><td class="num">80,000</td></tr><tr><td><b>Office rent</b></td><td>Day 5</td><td><span class="badge">Upcoming</span></td><td class="num">20,000</td></tr><tr><td><b>Supplier invoice</b><div class="small muted">Fictional counterparty · 供应商</div></td><td>Day 7</td><td><span class="badge warn">Funding needed</span></td><td class="num">90,000</td></tr><tr><td><b>Customer receipt</b><div class="small muted">Expected, not yet received</div></td><td>Day ${10+delay}</td><td><span class="badge blue">Scenario estimate</span></td><td class="num">+100,000</td></tr></tbody></table></div>`;}
function home(){return heading('Home','Your cash position, decisions and next steps.',btn('View documents',"go('documents')"))+`<section class="issue"><div><div class="eyebrow">Decision needed · Before day 7</div><h2>A CNY 90,000 gap needs a plan.</h2><p>Your supplier payment comes before the next customer receipt. This includes your CNY 20,000 minimum buffer.</p></div><div class="issueactions">${btn('Compare your options',"go('plans')",true)}${btn('Why CNY 90,000?','openEvidence()')}</div></section><div class="metrics">${metric('Current cash',120000,'Opening balance in this example')}${metric('Payments due · next 7 days',190000,'Payroll, rent and supplier')}${metric('Expected customer payment',100000,'Day '+(10+delay)+' · not yet received')}${metric('Lowest cash · no new action',-70000,'Below zero and your buffer',true)}</div><div class="grid"><section class="panel"><div class="panelhead"><div><h2>See the timing, not just the balance</h2><p>What happens if you keep the current payment dates?</p></div><button class="linkbtn" onclick="go('money')">Explore →</button></div>${chart(false)}</section><section class="panel"><div class="panelhead"><h2>Needs your attention</h2></div><div class="tasks taskgrid"><div class="task"><span class="tasknum">1</span><div><h3>Cover the funding gap</h3><p>Compare financing with a conditional payment extension.</p><button class="linkbtn" onclick="go('plans')">Review options →</button></div></div><div class="task"><span class="tasknum">2</span><div><h3>Check the customer timing</h3><p>A delayed receipt can change the plan.</p><button class="linkbtn" onclick="go('money')">Try a delay scenario →</button></div></div><div class="task"><span class="tasknum">3</span><div><h3>Review the source records</h3><p>Understand which facts support the calculation.</p><button class="linkbtn" onclick="openEvidence()">Open evidence →</button></div></div></div></section></div><section class="panel mt"><div class="panelhead"><h2>Upcoming money movements</h2><span class="badge">Sample records</span></div>${obligationsTable()}</section>`;}
function moneyPage(){const m=totals(true);return heading('Money','Explore timing and assumptions without changing your actual records.')+`<section class="panel"><div class="controls"><label>Customer payment delay<select id="delayControl" onchange="setDelay(this.value)"><option value="0" ${delay===0?'selected':''}>No extra delay · day 10</option><option value="5" ${delay===5?'selected':''}>5 days late · day 15</option><option value="25" ${delay===25?'selected':''}>25 days late · day 35</option></select></label><div><span class="badge blue">WHAT-IF</span><p class="small muted" style="margin-top:7px">Only the illustration changes. No actual facts are modified.</p></div></div><div class="panelhead"><div><h2>Cash before and after the plan</h2><p>Loan repayment is included even after the main cash-gap date.</p></div></div>${chart(true)}<div class="panelbody"><div class="callout ${m.min<20000?'bad':'good'}">${m.min<20000?`The financed plan does not preserve the buffer in this scenario. Minimum: <b>${full(m.min)}</b>. Review the repayment risk before choosing a plan.`:`The financed plan preserves the CNY 20,000 buffer in this example. Final cash: <b>${full(m.end)}</b>. This is not a guarantee about future customer payments.`}</div><div class="row wrap" style="margin-top:16px">${btn('Compare options',"go('plans')",true)}${btn('See source records','openEvidence()')}</div></div></section><section class="panel mt"><div class="panelhead"><h2>Events behind the forecast</h2></div>${obligationsTable()}</section>`;}
function plansPage(){let safe=totals(true).min>=20000;return heading('Plans','Cover the day-7 cash gap. Choose a plan with its conditions in view.')+`<div class="planstep"><span>1 · Understand the gap</span><span class="current">2 · Compare options</span><span>3 · Review exact action</span><span>4 · Track the result</span></div>${delay?`<div class="callout warn" style="margin-bottom:20px">A ${delay}-day customer delay is selected in the what-if view. The extension alternative below is conditional on the original receipt date; it is not validated for this modified scenario.</div>`:''}<div class="cardgrid"><section class="plancard selected"><span class="badge ${safe?'blue':'bad'}">${safe?'Feasible in selected example':'Needs revision'}</span><h2>Bridge financing</h2><p>Receive money before the supplier payment. Repayment comes later.</p><dl><dt>Net cash received</dt><dd>CNY 90,000</dd><dt>Total financing cost</dt><dd>CNY 2,000</dd><dt>Principal / repayment</dt><dd class="smallvalue">91,000 / 92,000 CNY</dd><dt>Repayment date</dt><dd class="smallvalue">Day 30</dd><dt>Minimum cash</dt><dd class="smallvalue">${full(totals(true).min)}</dd></dl><button class="btn primary" ${safe?'':'disabled'} onclick="openApproval()">Preview exact-action review</button><p class="caption">DEMO terms. No application or payment is sent.</p></section><section class="plancard"><span class="badge warn">Conditional · not executable</span><h2>Ask for more time</h2><p>Explore paying the supplier on day 12, after the day-10 customer receipt.</p><dl><dt>New debt</dt><dd>CNY 0</dd><dt>Financing cost in example</dt><dd>CNY 0</dd><dt>What must happen first</dt><dd class="smallvalue">Supplier confirmation</dd><dt>Dependency</dt><dd class="smallvalue">Customer pays on day 10</dd></dl>${btn('View the condition','openExtension()')}<p class="caption">A request alone does not change the payment deadline.</p></section><section class="plancard"><span class="badge bad">Not feasible on current dates</span><h2>Keep current dates</h2><p>Use existing funds only. The receipt arrives after the supplier must be paid.</p><dl><dt>New debt</dt><dd>CNY 0</dd><dt>Minimum cash</dt><dd class="negative">−70,000 CNY</dd><dt>Gap including buffer</dt><dd class="smallvalue">CNY 90,000</dd><dt>Blocking date</dt><dd class="smallvalue">Day 7</dd></dl>${btn('Understand the gap','openEvidence()')}<p class="caption">Not shown as an executable or recommended option.</p></section></div><section class="panel mt"><div class="panelhead"><h2>Understand the trade-off</h2><button class="linkbtn" onclick="go('money')">Change the scenario →</button></div>${chart(true)}<div class="panelbody"><div class="callout">These are simplified alternatives, not a universal optimum. A late customer receipt may create a repayment shortfall even if the final balance is positive.</div></div></section>`;}
function documentsPage(){return heading('Documents','Turn source records into reviewed financial facts, without technical IDs.')+`<div class="planstep"><span class="${mapping?'':'current'}">1 · Add records</span><span class="${mapping?'current':''}">2 · Map columns</span><span>3 · Review issues</span><span>4 · Use verified data</span></div><section class="panel"><div class="panelhead"><div><h2>${mapping?'Check what each column means':'Start with a bank statement or obligations list'}</h2><p>Design preview only. This file does not upload or parse your documents.</p></div></div><div class="panelbody">${mapping?`<div class="tablewrap"><table><thead><tr><th>Source column</th><th>Meaning</th><th>Example value</th></tr></thead><tbody><tr><td>Amount</td><td>Money amount in CNY</td><td>90,000.00</td></tr><tr><td>Due date</td><td>Contractual payment date</td><td>Day 7</td></tr><tr><td>Counterparty</td><td>Supplier / customer name</td><td>供应商 · Sample supplier</td></tr><tr><td>Status</td><td>Obligation state, not bank settlement</td><td>Unpaid</td></tr></tbody></table></div><div class="callout warn mt">An unpaid invoice is not a cash movement. The actual importer must validate types, source semantics and ambiguous dates before committing facts.</div><div class="row wrap mt">${btn('Preview review detail','openImportReview()',true)}${btn('Back to import choice','mapping=false;render()')}</div>`:`<div class="dropzone"><h3>Preview the import journey</h3><p>CSV / XLSX mapping → source preview → issue review → confirmation.</p>${btn('Use the sample mapping','mapping=true;render()',true)}</div>`}</div></section><section class="panel mt"><div class="panelhead"><h2>Records used in this illustration</h2><button class="linkbtn" onclick="openEvidence()">View evidence →</button></div>${obligationsTable()}</section>`;}
function activityPage(){return heading('Activity','Know what is waiting for you and what has actually happened.')+`<div class="twocol"><section class="panel"><div class="panelhead"><h2>${reviewed?'Approval preview recorded':'One decision to review'}</h2><span class="badge ${reviewed?'blue':'warn'}">Prototype state</span></div><div class="panelbody"><p>${reviewed?'You reviewed the loan draw in the visual prototype. No server approval, queue job, loan or payment exists.':'Preview the exact-action review for the bridge loan. In the real product this requires a fresh command and an owner approval.'}</p><div class="detailslist"><span>Principal</span><span>CNY 91,000</span><span>Net proceeds</span><span>CNY 90,000</span><span>Repayment on day 30</span><span>CNY 92,000</span></div>${btn('Open review preview','openApproval()',true)}</div></section><section class="panel"><div class="panelhead"><h2>Operation-state example</h2></div><div class="panelbody"><div class="callout warn"><b>Checking payment status</b><br>The provider response is missing. Funds stay reserved; do not send another payment.</div><p class="caption">This is a design example of UNKNOWN, not the state of a real operation.</p>${btn('See safe next steps','openUnknown()')}</div></section></div><section class="panel mt"><div class="panelhead"><h2>Journey in this prototype</h2></div><div class="timeline"><div class="event"><b>Sample case loaded</b><p>Golden-demo arithmetic is shown with relative dates.</p></div><div class="event"><b>Options available for comparison</b><p>Financing, a conditional extension, and the current-date baseline.</p></div>${reviewed?'<div class="event"><b>Owner-review UI explored</b><p>Only local in-memory prototype state changed. No actual command was created.</p></div>':''}<div class="event"><b>Execution not connected</b><p>The production implementation must use its existing worker, sandbox and reconciliation services.</p></div></div></section>`;}
function render(){view=['home','money','plans','documents','activity'].includes(location.hash.slice(1))?location.hash.slice(1):'home';$('#navigation').innerHTML=navItems.map(([id,title,path])=>`<a href="#${id}" class="${view===id?'active':''}" ${view===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>${title}</a>`).join('');$('#main').innerHTML=({home,money:moneyPage,plans:plansPage,documents:documentsPage,activity:activityPage}[view])()+footer();document.title=navItems.find(i=>i[0]===view)[1]+' · SME Finance UX concept';}
function setDelay(v){delay=Number(v);render();$('#delayControl')?.focus();announce('Illustrative customer delay changed to '+delay+' days. Actual financial records are not connected.');}
function showDialog(title,body,foot='',cls=''){const d=$('#dialog');if(d.open)d.close();d.className=cls;d.innerHTML=`<div class="dialoghead"><h2 id="dialogTitle">${title}</h2><button class="close" aria-label="Close dialog" onclick="closeDialog()">×</button></div><div class="dialogbody">${body}</div>${foot?`<div class="dialogfoot">${foot}</div>`:''}`;d.showModal();}
function closeDialog(){$('#dialog').close();}
function openEvidence(){showDialog('Why the gap is CNY 90,000',`<span class="badge">Illustrative evidence · not API records</span><p style="margin-top:15px">The source amounts come from the golden example in the technical report, section 21.</p><div class="detailslist"><span>Opening cash</span><span>120,000 CNY</span><span>Payroll + rent + supplier</span><span>−190,000 CNY</span><span>Cash before customer payment</span><span>−70,000 CNY</span><span>Required buffer</span><span>20,000 CNY</span><span>Additional net funds needed</span><span>90,000 CNY</span></div><div class="source"><b>Bank balance record</b><small>Demonstration opening balance · source-type example</small></div><div class="source"><b>Three payment obligations</b><small>Payroll 80,000 · rent 20,000 · supplier 90,000</small></div><div class="source"><b>Expected customer receipt</b><small>100,000 CNY on day 10 in the original scenario; not cash today.</small></div><p class="caption">The actual product must link each item to an authorized source/fact/result with its correct type. A snapshot ID is not a source document.</p>`,btn('Close','closeDialog()'));}
function openApproval(){showDialog('Review this exact action',`<span class="badge blue">Visual approval preview</span><h3 style="margin:16px 0 7px">Draw a bridge loan · CNY 91,000</h3><p class="muted">DEMO provider and fixed example terms. This approves no supplier payment.</p><div class="detailslist"><span>Gross principal</span><span>91,000 CNY</span><span>Upfront fee</span><span>1,000 CNY</span><span>Net received on day 2</span><span>90,000 CNY</span><span>Repayment fee</span><span>1,000 CNY</span><span>Total repayment · day 30</span><span>92,000 CNY</span><span>Total financing cost</span><span>2,000 CNY</span></div><div class="callout warn">In the actual product, a changed amount, recipient, policy or applicable terms requires a fresh review. Future actions still need their own approval.</div><label class="checklabel"><input id="previewConsent" type="checkbox" onchange="document.getElementById('previewApprove').disabled=!this.checked"><span>I understand this is a design demonstration and does not send a loan request or financial command.</span></label>`,btn('Back','closeDialog()')+'<button id="previewApprove" class="btn primary" disabled onclick="reviewed=true;closeDialog();go(\'activity\');announce(\'Approval UI preview completed; no financial action was sent.\')">Preview reviewed state</button>');}
function openExtension(){showDialog('An extension is not confirmed yet',`<span class="badge warn">Conditional alternative</span><p style="margin-top:16px">If the supplier agrees to day 12 and the customer pays on day 10, the example can avoid new debt while keeping a CNY 20,000 buffer.</p><div class="detailslist"><span>Current due date</span><span>Day 7</span><span>Proposed due date</span><span>Day 12</span><span>Required evidence</span><span>Observed supplier confirmation</span><span>Current factual date changes?</span><span>No</span></div><div class="callout">Until a valid confirmation is received, the actual obligation remains due on day 7. A draft or sent request is not permission to postpone payment.</div><p class="caption">If customer timing changes, recalculate this alternative. No request is sent from this prototype.</p>`,btn('Back to plans','closeDialog()'));}
function openImportReview(){showDialog('Review the meaning, not just the text',`<span class="badge warn">Example review issue</span><h3 style="margin:16px 0 8px">“Payment date” needs clarification</h3><p>Does this mean the contractual due date or the date money actually moved? The importer must not silently treat an expected payment as settled cash.</p><div class="callout mt">In the real importer, choosing a meaning updates the validated mapping, preserves the original source and records the reviewer. This prototype stores no import.</div>`,btn('Back to mapping','closeDialog()'));}
function openUnknown(){showDialog('Do not send the payment again',`<span class="badge warn">Operation-state design</span><p style="margin-top:16px">A missing response does not prove that a payment failed.</p><div class="source"><b>Keep the reservation</b><small>Do not make uncertain funds available to another action.</small></div><div class="source"><b>Check the existing operation</b><small>Look up the same stable key; do not create another payment.</small></div><div class="source"><b>Reconcile actual movements</b><small>Only the observed result changes the final financial status.</small></div><p class="caption">The real UI should surface persisted worker events and recovery results, not animate fake success.</p>`,btn('Close','closeDialog()'));}
function openInfo(){showDialog('About this UX prototype',`<p>This is a new interaction proposal, not a screenshot or implementation audit of the existing product.</p><p style="margin-top:13px">You can navigate five sections, compare options, change the illustrative customer delay, inspect evidence and preview a review dialog.</p><div class="callout mt">No network calls, model inference, bank commands, file uploads or persistent records. Financial arithmetic is illustrative and must not replace the tested backend.</div><p class="caption">Current report: TECHNICAL_REPORT_RU.md. Design and implementation instructions: AUDIT_AND_UX_SPEC_RU.md and CODEX_NEXT_ITERATION.md.</p>`,btn('Close','closeDialog()'));}
function openCopilot(){showDialog('Copilot · current financial case',`<span class="badge">NO LIVE MODEL · DESIGN EXAMPLE</span><p style="margin-top:16px">The actual Copilot should understand the case you are viewing and offer focused next steps.</p><button class="promptchip" onclick="showCopilotAnswer('gap')">Why do I need CNY 90,000?</button><button class="promptchip" onclick="showCopilotAnswer('late')">What if the customer is 25 days late?</button><button class="promptchip" onclick="closeDialog();openEvidence()">Show the underlying records</button><div id="copilotAnswer"></div><p class="caption">These buttons reveal authored design examples. They do not call a model or prove agent capability.</p>`,'','copilotdialog');}
function showCopilotAnswer(kind){if(kind==='late'){delay=25;render();$('#copilotAnswer').innerHTML=`<div class="answer"><span class="badge">Prototype calculation</span><p style="margin-top:12px">With the receipt moved to day 35, repayment on day 30 takes the financed example to <b>${full(totals(true).min)}</b> before the customer pays.</p><p>Final cash still becomes CNY 28,000 later. That does not make the interim shortage acceptable.</p><button class="linkbtn" style="margin-top:12px" onclick="closeDialog();go('money')">Open the scenario →</button></div>`;}else{$('#copilotAnswer').innerHTML='<div class="answer"><span class="badge">Prototype calculation</span><p style="margin-top:12px">You have CNY 120,000 and CNY 190,000 of payments before the next receipt. That leaves a CNY 70,000 shortage.</p><p>Adding your CNY 20,000 buffer gives <b>CNY 90,000 of net funding needed</b>.</p><button class="linkbtn" style="margin-top:12px" onclick="closeDialog();go(\'plans\')">Compare the options →</button></div>';}announce('Authored design example displayed. No model was called.');}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});});render();
</script>
</body></html>
